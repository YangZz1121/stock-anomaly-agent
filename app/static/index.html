<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>异动研究</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app">
  <div class="stage">
    <header class="stage-bar">
      <div class="stage-title">个股异动研究</div>
      <div class="stage-actions">
        <button class="ghost" id="newChatBtn" type="button">新建对话</button>
        <button class="ghost" id="evidenceBtn" type="button" disabled>证据链</button>
        <button class="ghost" id="traceBtn" type="button" disabled>研究过程</button>
      </div>
    </header>

    <div class="banner hidden" id="degradedBanner"></div>

    <div class="thread" id="thread"></div>

    <footer class="composer">
      <div class="composer-card">
        <div class="window-row" id="windowRow">
          <span class="win-label">研究窗口</span>
          <div class="chips" id="windowChips"></div>
        </div>
        <div class="composer-row">
          <textarea id="queryInput" rows="1" autocomplete="off"
            placeholder="问一只股票或一个板块，例如：科技股最近有明显异动的股票么"></textarea>
          <button id="runBtn" class="send" type="button" aria-label="发送">↑</button>
        </div>
      </div>
      <p class="legal">研究结论，不是投资建议。不做买卖推荐，也不对股价做确定性预测。</p>
    </footer>
  </div>
</div>

<div class="drawer-backdrop hidden" id="drawerBackdrop"></div>
<aside class="drawer hidden" id="drawer">
  <div class="drawer-head">
    <h2 id="drawerTitle"></h2>
    <button class="ghost close" id="drawerClose" type="button">关闭</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script src="/static/app.js"></script>
</body>
</html>
